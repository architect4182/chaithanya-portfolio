<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="sybg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <radialGradient id="solarGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sybg)" />
  <rect width="1200" height="675" fill="url(#solarGlow)" />
  <!-- Solar cell isometric lattice -->
  <g stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2" fill="none">
    <polygon points="600,160 740,240 600,320 460,240" fill="rgba(14, 165, 233, 0.08)" />
    <polygon points="740,240 880,320 740,400 600,320" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.3)" />
    <polygon points="460,240 600,320 460,400 320,320" fill="rgba(14, 165, 233, 0.05)" />
    <line x1="600" y1="160" x2="600" y2="400" stroke="rgba(251, 191, 36, 0.4)" stroke-dasharray="4 4" />
  </g>
  <text x="600" y="460" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="40" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="8">SYNAPSE ROOF</text>
  <text x="600" y="495" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#38bdf8" text-anchor="middle" letter-spacing="5">HIGH-PERFORMANCE ARCHITECTURAL SOLAR</text>
</svg>