<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040612" />
      <stop offset="50%" stop-color="#080c21" />
      <stop offset="100%" stop-color="#02030a" />
    </linearGradient>
    <radialGradient id="planetGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sphere" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#pbg)" />
  <rect width="1200" height="675" fill="url(#planetGlow)" />
  <!-- Orbital Ellipses -->
  <g stroke="rgba(96, 165, 250, 0.25)" stroke-width="1.2" fill="none">
    <ellipse cx="600" cy="270" rx="360" ry="110" transform="rotate(-15 600 270)" />
    <ellipse cx="600" cy="270" rx="240" ry="75" transform="rotate(-15 600 270)" stroke-dasharray="5 5" />
  </g>
  <circle cx="600" cy="270" r="75" fill="url(#sphere)" />
  <ellipse cx="600" cy="270" rx="140" ry="25" transform="rotate(-15 600 270)" stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.8" />
  <text x="600" y="420" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="42" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="10">PLANETS</text>
  <text x="600" y="455" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="5">INTERACTIVE CELESTIAL EXPLORER</text>
</svg>